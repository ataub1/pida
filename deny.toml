    { crate = "png@0.17.16", reason = "ico 0.5 (tauri-codegen, Build-Zeit)" },
    { crate = "proc-macro-crate@1.3.1", reason = "gtk3-macros 0.18 (Tauri, Linux, Build-Zeit)" },
    { crate = "proc-macro-crate@2.0.2", reason = "glib-macros 0.18 (Tauri, Linux, Build-Zeit)" },
    { crate = "serde_spanned@0.6.9", reason = "toml 0.8 über system-deps (gtk-rs-sys, Linux, Build-Zeit)" },
    { crate = "syn@1.0.109", reason = "proc-macro-error 1.0 (glib-macros 0.18, Linux, Build-Zeit)" },
    { crate = "thiserror@1.0.69", reason = "gtk-rs 0.18 und jni 0.21 (Tauri, Linux/Android)" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0 (gtk-rs 0.18, jni 0.21)" },
