# cargo-about 0.9.2: Drittlizenz-Hinweise der Rust-Abhängigkeiten (Plan §2.5, §10.2).
# Aufruf über tools/third-party-notices.sh (dort auch PDFium, Fonts/AFM und npm).
#
# Dieselbe Allowlist wie deny.toml; was hier fehlt, bricht die Erzeugung ab (--fail).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Bitstream-Vera",
    # nur über die Klarstellung für regex-syntax (Unicode-Tabellen, siehe unten)
    "Unicode-DFS-2016",
]

# Ausgelieferte Ziele (wie deny.toml [graph] targets).
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

# Nur, was im Binary landet: Testabhängigkeiten nicht; Build-Abhängigkeiten (Proc-Macros,
# Build-Skripte) vorsorglich schon.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Lizenztexte kommen ausschließlich aus den Crate-Quellen (Aufruf mit --offline/--locked).

# Eigene Crates (EUPL-1.2, publish = false) gehören nicht in die Drittlizenzen.
private = { ignore = true }

# Bekannte Paketierungslücken (Lizenzdateien ohne erkennbaren SPDX-Text), von cargo-about gepflegt.
workarounds = ["ring", "rustls"]

# target-lexicon 0.12: Build-Abhängigkeit von cfg-expr/system-deps (gtk-rs-sys über Tauri, nur Linux);
# Apache-2.0 mit LLVM-Ausnahme (permissiver als Apache-2.0). Wie die Ausnahme in deny.toml.
[target-lexicon]
accepted = ["Apache-2.0 WITH LLVM-exception"]

# regex-syntax: Das Lizenzfeld nennt nur „MIT OR Apache-2.0“, die eingebetteten Unicode-Tabellen stehen aber unter
# der Unicode-Lizenz von 2016 (src/unicode_tables/LICENSE-UNICODE, „Unicode, Inc. License Agreement – Data Files
# and Software“); sie muss den Hinweisen beiliegen. Prüfsummen gelten für 0.8.11 – bei einem Update neu setzen
# (cargo-about bricht sonst ab).
[regex-syntax.clarify]
license = "(MIT OR Apache-2.0) AND Unicode-DFS-2016"

[[regex-syntax.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "6485b8ed310d3f0340bf1ad1f47645069ce4069dcc6bb46c7d5c6faf41de1fdb"

[[regex-syntax.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"

[[regex-syntax.clarify.files]]
path = "src/unicode_tables/LICENSE-UNICODE"
license = "Unicode-DFS-2016"
checksum = "74db5baf44a41b1000312c673544b3374e4198af5605c7f9080a402cec42cfa3"
