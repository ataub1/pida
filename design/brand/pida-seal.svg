<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!--
    PIDA – Siegel (Standard-Bildmarke im Signaturblock, ADR 0005). Eigenes Werk des Projekts, EUPL-1.2.
    Geometrie und Farben exakt wie `DefaultEmblem` in prototypes/pida-workspace/src/ui/Logo.tsx:
    weißer Kreis mit Ring #3a414d, gepunkteter Innenring, Häkchen #1f2630, rot-weiß-roter Streifen #c8102e.
    Kein Hoheitszeichen (kein Adler, kein Wappen), rot-weiß-rot nur als Farbakzent.
    Rasterfassungen erzeugt design/brand/tools/build.mjs.
  -->
  <title>PIDA – Siegel</title>
  <circle cx="20" cy="20" r="17.5" fill="#ffffff" stroke="#3a414d" stroke-width="1.6"/>
  <circle cx="20" cy="20" r="13.6" fill="none" stroke="#3a414d" stroke-width="0.7" stroke-dasharray="1.2 1.4"/>
  <path d="M12.5 20.8 17.6 25.6 27.8 14.6" fill="none" stroke="#1f2630" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15" y="30.2" width="10" height="1.3" fill="#c8102e"/>
  <rect x="15" y="31.5" width="10" height="1.1" fill="#ffffff"/>
  <rect x="15" y="32.6" width="10" height="1.3" fill="#c8102e"/>
</svg>
