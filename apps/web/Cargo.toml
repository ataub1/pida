[package]
name = "pida-web"
description = "PIDA – Web-Shell: der Kern als WebAssembly im Browser (Konzept Webdienst, Variante E)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pida-core-api = { workspace = true }
pida-config = { workspace = true }
pida-backend-api = { workspace = true }
pida-backend-atrust-web = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
pida-workflow = { workspace = true }
pida-i18n = { workspace = true }
pida-fs = { workspace = true }
pida-render = { workspace = true, features = ["pdfium"] }
serde_json = { workspace = true }
tracing = { workspace = true }

# nur im Browser: Anbindung an JavaScript; Zufall über crypto.getRandomValues (beide getrandom-Generationen)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
