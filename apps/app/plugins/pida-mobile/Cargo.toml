[package]
name = "tauri-plugin-pida-mobile"
description = "PIDA – Tauri-Mobile-Plugin: sicherer Speicher, Teilen/Exportieren, Import, eingehende Dokumente, TLS-Initialisierung (native Seiten: iOS Swift, Android Kotlin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# Tauri-Konvention: `links` = Paketname (tauri-plugin prüft das im Build-Skript).
links = "tauri-plugin-pida-mobile"

[build-dependencies]
# Build-Skript der Tauri-Plugins (Berechtigungen, Swift-Paket bzw. Android-Bibliothek einbinden).
# 2.7.2 = Version, die tauri 2.12.4 und die übrigen Plugins im Graph verwenden; Apache-2.0 OR MIT.
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Android: rustls-platform-verifier braucht den JNI-Kontext der App (src/tls.rs). Alle drei Crates sind
# bereits über reqwest/tao im Abhängigkeitsbaum; Versionen exakt wie dort. jni: MIT OR Apache-2.0,
# ndk-context: MIT OR Apache-2.0, rustls-platform-verifier: MIT OR Apache-2.0.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = { version = "=0.7.1" }
jni = { version = "=0.22.4", default-features = false }
ndk-context = { version = "=0.1.1" }

[lints]
workspace = true
