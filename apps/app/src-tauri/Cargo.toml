[package]
name = "pdfover-app"
description = "PDF-Over NG – Tauri-2-Shell (Desktop, später Mobile): bindet pdfover-core-api an (dispatch/subscribe, pdfover-render://)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "pdf-over-ng"

# Tauri-2-Muster: Bibliothek (für Mobile als staticlib/cdylib) + dünnes Desktop-Binary.
[lib]
name = "pdfover_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdf-over-ng"
path = "src/main.rs"

[build-dependencies]
# Tauri 2.12.x exakt gepinnt (Plan §2.5); die Integration hebt die Einträge in [workspace.dependencies].
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
pdfover-core-api = { workspace = true }
pdfover-config = { workspace = true }
pdfover-backend-api = { workspace = true }
pdfover-workflow = { workspace = true }
pdfover-i18n = { workspace = true }
# Tauri 2.12.4 (Apache-2.0 OR MIT), Plan §2.1 „Tauri 2.12.x, gepinnt“.
tauri = { version = "=2.12.4", features = [] }
# Datei-/Speichern-Dialoge (Apache-2.0 OR MIT).
tauri-plugin-dialog = { version = "=2.8.3" }
# Ergebnis/Ordner/Links im System öffnen (Apache-2.0 OR MIT).
tauri-plugin-opener = { version = "=2.7.2" }
# OS-Sprache für `Lang::set_system` (MIT OR Apache-2.0), siehe docs/integration/wave1-offene-punkte.md.
sys-locale = { version = "=0.3.2" }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Nur Desktop: eine Instanz übernimmt „Öffnen mit“/„Senden an“ (Apache-2.0 OR MIT).
tauri-plugin-single-instance = { version = "=2.5.4" }
# Nur Desktop: Fenstergröße/-position merken (Apache-2.0 OR MIT).
tauri-plugin-window-state = { version = "=2.5.0" }

# Natives FIDO2 nur auf dem Desktop (ADR 0001 §2): Windows über webauthn.dll, macOS/Linux über CTAP-HID.
[target.'cfg(windows)'.dependencies]
pdfover-backend-atrust = { workspace = true, features = ["fido2-windows"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
pdfover-backend-atrust = { workspace = true, features = ["fido2-hid"] }

[target.'cfg(not(any(windows, target_os = "macos", target_os = "linux")))'.dependencies]
pdfover-backend-atrust = { workspace = true }

[dev-dependencies]
# Serde-Vertragstest Rust ↔ TypeScript (tests/serde_contract.rs)
pdfover-placement = { workspace = true }
pdfover-pades = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
