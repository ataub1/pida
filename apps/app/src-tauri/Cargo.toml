[package]
name = "pida-app"
description = "PIDA – Tauri-2-Shell (Desktop und Mobile): bindet pida-core-api an (dispatch/subscribe, pida-render://)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "pida"

# Tauri-2-Muster: Bibliothek (für Mobile als staticlib/cdylib) + dünnes Desktop-Binary.
[lib]
name = "pida_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pida"
path = "src/main.rs"

[build-dependencies]
# Tauri 2.12.x exakt gepinnt (Plan §2.5, [workspace.dependencies]).
tauri-build = { workspace = true }

[dependencies]
pida-core-api = { workspace = true }
pida-config = { workspace = true }
pida-backend-api = { workspace = true }
pida-workflow = { workspace = true }
pida-i18n = { workspace = true }
# nur die Bibliotheks-Auflösung (`library_paths_in`: iOS-Framework, Android jniLibs), ohne PDFium-Bindung
pida-render = { workspace = true }
# Mobile-Plugin (sicherer Speicher, Teilen/Exportieren, Import, eingehende Dokumente, TLS unter Android);
# auf dem Desktop ohne native Seite (alle Methoden „nicht unterstützt“).
tauri-plugin-pida-mobile = { workspace = true }
# PDF-Over-Startargumente mit dem Parser der CLI (ohne Feature `run`), siehe src/args.rs
pida-cli = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
# Tauri 2.12.4 (Apache-2.0 OR MIT), Plan §2.1 „Tauri 2.12.x, gepinnt“.
tauri = { workspace = true }
# Ergebnis/Ordner/Links im System öffnen (Apache-2.0 OR MIT).
tauri-plugin-opener = { workspace = true }
# OS-Sprache für `Lang::set_system` (MIT OR Apache-2.0), siehe docs/integration/wave1-offene-punkte.md.
sys-locale = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Nur Desktop: eine Instanz übernimmt „Öffnen mit“/„Senden an“ (Apache-2.0 OR MIT).
tauri-plugin-single-instance = { workspace = true }
# Nur Desktop: Fenstergröße/-position merken (Apache-2.0 OR MIT).
tauri-plugin-window-state = { workspace = true }
# Nur Desktop: Datei-/Speichern-Dialoge (Apache-2.0 OR MIT). Mobile nutzt Dokument-Picker bzw. SAF über
# `pida-mobile`; ohne das Plugin fehlen dort auch dessen Photos/PhotosUI-Bezüge (iOS, App-Store-
# Zweckangaben) und die zusätzliche Kotlin-Bibliothek.
tauri-plugin-dialog = { workspace = true }

# Natives FIDO2 nur auf dem Desktop (ADR 0001 §2): Windows über webauthn.dll, macOS/Linux über CTAP-HID.
[target.'cfg(windows)'.dependencies]
pida-backend-atrust = { workspace = true, features = ["fido2-windows"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
pida-backend-atrust = { workspace = true, features = ["fido2-hid"] }

# macOS: Besitzer des Single-Instance-Sockets im gemeinsamen /tmp prüfen (src/instance.rs).
[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true }

[target.'cfg(not(any(windows, target_os = "macos", target_os = "linux")))'.dependencies]
pida-backend-atrust = { workspace = true }

[dev-dependencies]
# Serde-Vertragstest Rust ↔ TypeScript (tests/serde_contract.rs)
pida-placement = { workspace = true }
pida-pades = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
