name: pida-app
options:
  bundleIdPrefix: at.pida
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: PIDA
      PRODUCT_BUNDLE_IDENTIFIER: at.pida
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  pida-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: pida-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: pida-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Version wie Cargo.toml/package.json/tauri.conf.json (die CLI überschreibt sie beim Build aus `version`)
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: "0.2.0"
        # --- PIDA (M-iOS, docs/integration/mobile-ios.md) ---
        CFBundleDisplayName: PIDA
        # Urheberrecht wie bundle.copyright in tauri.conf.json (ADR 0004 Nachtrag 21)
        NSHumanReadableCopyright: "© 2026 A-SIT · EUPL-1.2"
        # Sprachen der App: Systemoberfläche im Prozess (Dokumentauswahl „Abbrechen“, Teilen „Kopieren/Drucken“,
        # Leiste über der Tastatur) in der Gerätesprache – ohne Angabe gilt die App als nur englisch
        CFBundleLocalizations: [de, en]
        # „Öffnen in“/Teilen für PDF (Rang Alternate: nie Standard-App für PDF)
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        # Original öffnen (Security-Scoped URL, Kopie in die Sandbox) statt Kopie in Documents/Inbox;
        # zusammen mit UIFileSharingEnabled erscheint „Documents“ (signierte Dokumente) in der Dateien-App
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # Nur Standardverfahren (TLS, Signatur/Authentisierung) – Exportkontrolle: ausgenommen
        ITSAppUsesNonExemptEncryption: false
        # ATS ohne Ausnahmen (nur HTTPS; keine lokale BKU), kein Face ID, keine Kamera/Fotos
    entitlements:
      path: pida-app_iOS/pida-app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # PDFium (tools/fetch-pdfium.sh --xcframework): nur einbetten und signieren, nicht linken –
      # pida-render lädt Frameworks/pdfium.framework/pdfium zur Laufzeit (dlopen)
      - framework: ../../../../../tools/pdfium/apple/PDFium.xcframework
        link: false
        embed: true
        codeSign: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a