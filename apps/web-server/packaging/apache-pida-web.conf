# PIDA Web hinter Apache – Vorlage. Domain eintragen, dann:
#   a2enmod proxy proxy_http headers ssl deflate brotli      (Debian/Ubuntu; RHEL: Module sind meist schon aktiv)
#   Debian/Ubuntu: a2ensite pida-web && systemctl reload apache2
#   RHEL/Alma/Rocky: nach /etc/httpd/conf.d/pida-web.conf kopieren, setsebool -P httpd_can_network_connect 1,
#                    systemctl reload httpd
#   Zertifikat: certbot --apache -d pida.example.at
# Port wie PIDA_WEB_BIND in /etc/pida-web/pida-web.env.
<VirtualHost *:443>
    ServerName pida.example.at

    SSLEngine on
    # Zertifikatspfade trägt certbot ein

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:1442/
    ProxyPassReverse / http://127.0.0.1:1442/
    # Long-Poll der Seite (25 s) und die Antwort an A-Trust
    ProxyTimeout 120

    # Befehle mit dem Dokument als Base64 bis 96 MB (Grenze des Servers)
    LimitRequestBody 104857600

    # WebAssembly und JavaScript komprimieren
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS application/wasm text/javascript text/css text/html application/json
    </IfModule>
    AddOutputFilterByType DEFLATE application/wasm text/javascript text/css text/html application/json

    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
