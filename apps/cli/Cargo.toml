[package]
name = "pida-cli"
description = "PIDA Kommandozeile: kompatibel zu PDF-Over (-i -o -b -n -p -ks … -c -v), headless für Keystore/lokale BKU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Bibliothek: Argument-Parser (auch für die GUI-Shell, ohne Feature `run`) und Ablauf der CLI.
[lib]
name = "pida_cli"
path = "src/lib.rs"

[[bin]]
name = "pida-cli"
path = "src/main.rs"
required-features = ["run"]

[features]
default = ["run"]
# Ablauf der Kommandozeile (Kern, Terminal, Subcommands). Ohne `run` bleibt nur der Parser der
# PDF-Over-Argumente (`parse`, `to_overlay`, `overlay::{check, inputs}`) – so nutzt ihn die GUI.
run = [
    "dep:pida-core-api",
    "dep:pida-workflow",
    "dep:pida-backend-api",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:serde_json",
    "dep:rpassword",
    "notices",
]
# EUPL-Text und eingebettete Drittlizenz-Hinweise (`notices`, build.rs) – für `pida-cli licenses` und die Anzeige in
# der App (Backlog Nr. 2: auch Android, wo das Paket keine Ressourcendateien hat)
notices = ["dep:flate2"]

[dependencies]
pida-config = { workspace = true }
pida-i18n = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
pida-core-api = { workspace = true, optional = true }
pida-workflow = { workspace = true, optional = true }
# Typen der Masken/Meldungen im ViewState (NativeForm, Notice, SecretKind)
pida-backend-api = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Verdeckte Eingabe von Passwort/TAN im Terminal (Unix: termios, Windows: Console-API). Apache-2.0.
rpassword = { workspace = true, optional = true }
# Entpacken der eingebetteten Drittlizenz-Hinweise (`pida-cli licenses`, build.rs)
flate2 = { workspace = true, optional = true }

[build-dependencies]
flate2 = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
pida-core-api = { workspace = true, features = ["testing"] }
pida-backend-api = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true
