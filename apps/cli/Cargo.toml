[package]
name = "pdfover-cli"
description = "PDF-Over NG Kommandozeile: kompatibel zu PDF-Over (-i -o -b -n -p -ks … -c -v), headless für Keystore/lokale BKU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Bibliothek: Argument-Parser (auch für die GUI-Shell, ohne Feature `run`) und Ablauf der CLI.
[lib]
name = "pdfover_cli"
path = "src/lib.rs"

[[bin]]
name = "pdfover-cli"
path = "src/main.rs"
required-features = ["run"]

[features]
default = ["run"]
# Ablauf der Kommandozeile (Kern, Terminal, Subcommands). Ohne `run` bleibt nur der Parser der
# PDF-Over-Argumente (`parse`, `to_overlay`, `overlay::{check, inputs}`) – so nutzt ihn die GUI.
run = [
    "dep:pdfover-core-api",
    "dep:pdfover-workflow",
    "dep:pdfover-backend-api",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:serde_json",
    "dep:rpassword",
]

[dependencies]
pdfover-config = { workspace = true }
pdfover-i18n = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
pdfover-core-api = { workspace = true, optional = true }
pdfover-workflow = { workspace = true, optional = true }
# Typen der Masken/Meldungen im ViewState (NativeForm, Notice, SecretKind)
pdfover-backend-api = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Verdeckte Eingabe von Passwort/TAN im Terminal (Unix: termios, Windows: Console-API). Apache-2.0.
rpassword = { workspace = true, optional = true }

[dev-dependencies]
pdfover-core-api = { workspace = true, features = ["testing"] }
pdfover-backend-api = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true
