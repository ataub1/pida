# PIDA – Cargo-Workspace
#
# Verbindliche Grundlage: docs/00-architektur-und-umsetzungsplan.md (§2 Stack/Pinning, §3 Architektur)
# und docs/adr/0001-workspace-und-schnittstellen.md (Crate-Graph, Ownership, Regeln für die parallele Arbeit).
#
# WICHTIG für die Paket-Agenten: Diese Datei ändert nur die Integration. Neue Abhängigkeiten kommen
# zunächst in das eigene Crate-Cargo.toml (mit `workspace = true`, wenn hier vorhanden, sonst mit
# exakter Version); die Integration hebt sie danach in [workspace.dependencies]. Siehe ADR 0001 §4
# und docs/entwicklung.md („Abhängigkeiten“).

[workspace]
resolver = "3"
members = [
    # Basis
    "crates/java-properties",
    "crates/fs",
    "crates/i18n",
    "crates/pdf-cos",
    "crates/cades",
    "crates/render",
    "crates/net",
    "crates/sl12",
    # Ebene 1
    "crates/pdf-incremental",
    "crates/sigblock",
    "crates/placement",
    "crates/backend-api",
    "crates/config",
    # Ebene 2
    "crates/backend-keystore",
    "crates/backend-localbku",
    "crates/backend-atrust",
    "crates/backend-atrust-web",
    "crates/pades",
    # Ebene 3–4 (Integration)
    "crates/workflow",
    "crates/core-api",
    # Anwendungen
    "apps/cli",
    "apps/web",             # Web-Shell (WebAssembly), Konzept Webdienst
    "apps/web-server",      # Server der Web-Variante: Auslieferung, SL-Rückkanal, A-Trust-Testgegenstelle
    "apps/app/src-tauri",   # Tauri-2-Shell (Desktop und Mobile), ADR 0001 §3
    "apps/app/plugins/pida-mobile",   # Mobile-Plugin der Shell (Swift/Kotlin: M-iOS/M-Android)
]

[workspace.package]
version = "0.5.4"
edition = "2024"
# MSRV = die verifizierte Toolchain (Rust 1.99 stable). Die Abhängigkeiten selbst verlangen mindestens 1.88
# (lopdf 0.45, image 0.25, time 0.3.55, keyring 4); eine niedrigere MSRV wird erst nach CI-Nachweis gesenkt.
rust-version = "1.99"
license = "EUPL-1.2"
# Urheber (Entscheidung des Auftraggebers, ADR 0004 Nachtrag 21): A-SIT – Zentrum für sichere Informationstechnologie –
# Austria. Wird u. a. zum `Maintainer` des Debian-Pakets (tauri-bundler); Herausgeber und Copyright der Installer stehen
# in apps/app/src-tauri/tauri.conf.json (`bundle.publisher`, `bundle.copyright`).
authors = ["A-SIT"]
repository = "https://github.com/ataub1/pida"
publish = false

[workspace.dependencies]
# --- interne Crates -------------------------------------------------------------------------------
pida-java-properties = { path = "crates/java-properties" }
pida-fs = { path = "crates/fs" }
pida-i18n = { path = "crates/i18n" }
pida-pdf-cos = { path = "crates/pdf-cos" }
pida-pdf-incremental = { path = "crates/pdf-incremental" }
pida-cades = { path = "crates/cades" }
pida-sigblock = { path = "crates/sigblock" }
pida-pades = { path = "crates/pades" }
pida-placement = { path = "crates/placement" }
# Ohne Default-Features: Abhängige nutzen nur die Traits; `features = ["pdfium"]` nur dort, wo
# `PdfiumBackend` konstruiert wird (core-api, Tauri-Shell). ADR 0001 §8.
pida-render = { path = "crates/render", default-features = false }
pida-backend-api = { path = "crates/backend-api" }
pida-sl12 = { path = "crates/sl12" }
pida-backend-atrust = { path = "crates/backend-atrust" }
pida-backend-localbku = { path = "crates/backend-localbku" }
pida-backend-atrust-web = { path = "crates/backend-atrust-web" }
pida-backend-keystore = { path = "crates/backend-keystore" }
pida-net = { path = "crates/net" }
pida-workflow = { path = "crates/workflow" }
pida-config = { path = "crates/config" }
pida-core-api = { path = "crates/core-api" }
# Argument-Parser von PDF-Over (auch für die GUI-Shell); `features = ["run"]` = Ablauf der CLI.
pida-cli = { path = "apps/cli", default-features = false }
# Mobile-Plugin der Tauri-Shell (sicherer Speicher, Teilen/Exportieren, Import, eingehende Dokumente).
tauri-plugin-pida-mobile = { path = "apps/app/plugins/pida-mobile" }

# --- PDF ------------------------------------------------------------------------------------------
# Plan §2.1/§2.5: lopdf 0.45.x nur als Parser/Objektmodell (gekapselt in pdf-cos); kein rayon/chrono-clock,
# damit Mobile/WASM schlank bleiben.
lopdf = { version = "~0.45.0", default-features = false }
# Plan §2.1: PDFium über pdfium-render, auf den PDFium-Build gepinnt (pdfium_latest = 7881, Binaries chromium/8100).
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }

# --- RustCrypto: EINE Generation (cms 0.2 / der 0.7 / x509-cert 0.2 / spki 0.7), Plan §2.5 ----------
# Achtung: p12-keystore 0.4.1 zieht intern die Folgegeneration (der 0.8, cms 0.3-pre, sha2 0.11) – die
# Grenze ist DER-Bytes (`as_der()`), siehe ADR 0001 §5.2. Keine Typen dieser Generation in öffentlichen APIs.
cms = { version = "=0.2.3", features = ["std"] }
der = { version = "~0.7.10", features = ["std", "derive", "oid", "alloc"] }
x509-cert = { version = "~0.2.5", features = ["std"] }
spki = { version = "~0.7.3", features = ["std", "alloc"] }
const-oid = { version = "~0.9.6", features = ["db"] }
pkcs8 = { version = "~0.10.2", features = ["std"] }
sha1 = { version = "~0.10.6", features = ["oid"] }
sha2 = { version = "~0.10.9", features = ["oid"] }
rsa = { version = "~0.9.10", features = ["sha2", "std"] }
# EC (ECDSA, ECDH) schon in der Folgegeneration (RUSTSEC-2026-0387: crypto-bigint 0.5 nicht zeitkonstant):
# elliptic-curve 0.14 / ecdsa 0.17 / crypto-bigint 0.7. Die Grenze zu rsa/cms sind Bytes (PKCS#8-DER,
# SEC1-Punkt, Signaturwert), keine gemeinsamen Typen (ADR 0001 §5.2). rsa 0.9 bringt signature 2 selbst mit.
p256 = { version = "~0.14.0", features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "~0.14.0", features = ["ecdsa", "pkcs8", "std"] }
p521 = { version = "~0.14.0", features = ["ecdsa", "pkcs8", "std"] }
ecdsa = { version = "~0.17.0", features = ["der", "algorithm", "std"] }
signature = { version = "~3.0.0" }
p12-keystore = { version = "=0.4.1" }
# Nur Feature-Vereinigung (backend-keystore): aktiviert in der von p12-keystore 0.4.1 genutzten
# pkcs5-Version die Lesepfade PBES2/HMAC-SHA-1 (`sha1-insecure`) und DES-EDE3-CBC (`3des`). Version
# muss der von p12-keystore entsprechen und wird bei einem Update von p12-keystore mitgezogen.
pkcs5 = { version = "=0.8.1", default-features = false, features = ["sha1-insecure", "3des"] }
# Zufall für RSA-Blinding beim Signieren (`OsRng`, cades) und FIDO2 (IV, Token); dieselbe Generation wie rsa.
rand_core = { version = "=0.6.4", features = ["getrandom"] }

# --- Fonts, Bilder, QR ----------------------------------------------------------------------------
skrifa = "0.48.0"
read-fonts = "0.45.0"
subsetter = { version = "0.2.6", default-features = false }  # ohne variable-fonts: vermeidet zweite skrifa-Generation (0.42)
png = "0.18.1"
zune-jpeg = "0.5.15"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
kamadak-exif = "0.6.1"
flate2 = "1.1.10"
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

# --- Netz, HTML, XML ------------------------------------------------------------------------------
# Plan §2.1: reqwest 0.13 mit rustls (Provider ring statt aws-lc-rs) und rustls-platform-verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "cookies", "multipart", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5.8"
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
quick-xml = "0.42.0"
# Charset-Dekodierung von Antwortkörpern (net); bereits über reqwest/charset im Graph.
encoding_rs = "=0.8.42"
# Nur `hyper::ext::ReasonPhrase` (net); dieselben Features wie über reqwest im Graph.
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1.21", default-features = false }
http-body-util = "0.1.5"
bytes = "1.12.1"

# --- Allgemein ------------------------------------------------------------------------------------
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
async-trait = "0.1.92"
tokio = { version = "1.53.3", features = ["sync", "time", "rt", "macros"] }
futures = "0.3.34"
zeroize = { version = "1.9.1", features = ["zeroize_derive", "std"] }
# Ohne Feature `local-offset` (Welle 2): ungenutzt (lokale Zeit kommt aus `jiff`, s. u.) und zog
# `num_threads` 0.1.7, das für iOS nicht übersetzt (`libc::mach_task_self` fehlt) – damit scheiterte
# jedes Crate mit `time` am Ziel aarch64-apple-ios. `OffsetDateTime::now_local` steht nicht zur Verfügung.
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
# Zeitzonen (ADR 0001 §8): `time` bleibt Datentyp aller Schnittstellen (`OffsetDateTime`), ermittelt
# den lokalen Offset unter Unix in Mehrthread-Prozessen aber nicht und kennt keine IANA-Namen.
# `jiff` liefert lokale Zeitzone (inkl. Sommerzeit) und `timezone`-Profilwerte (`Europe/Vienna`).
jiff = "0.2.38"
# Browser (wasm32-unknown-unknown): Uhrzeit aus JavaScript (`Date.now()`), Konzept Webdienst Etappe 1 (MIT/Apache-2.0)
js-sys = "0.3.106"
# Browser: Instant/SystemTime aus JavaScript (wie std, MIT/Apache-2.0)
web-time = "1"
# Browser: Aufgaben auf dem Ereignis-Takt der Seite (spawn_local) und Zeitgeber (MIT/Apache-2.0)
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
# Web-Shell: JavaScript-Anbindung (MIT/Apache-2.0)
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"
base64 = "0.23.1"
hex = "0.4.3"
toml = "1.1.8"
directories = "6.0.0"
keyring = "4.2.0"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = { version = "0.9.6", features = ["macros"] }

# --- Anwendungen (Welle 3: aus den Crate-Manifesten gehoben) ---------------------------------------
# Logdatei mit Rotation (core-api, Plan §7.1). MIT.
tracing-appender = "=0.2.5"
# Verdeckte Eingabe im Terminal (CLI). Apache-2.0.
rpassword = "=7.5.4"
# Tauri 2.12.x exakt gepinnt (Plan §2.1/§2.5); Apache-2.0 OR MIT.
tauri = { version = "=2.12.4", features = [] }
tauri-build = { version = "=2.7.3", features = [] }
# Build-Skript eigener Tauri-Plugins (apps/app/plugins/pida-mobile); Version wie im Graph der Plugins.
tauri-plugin = { version = "=2.7.2", features = ["build"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"
# Eigene Benutzerkennung (geteuid ohne unsafe) für die Prüfung des Single-Instance-Sockets unter macOS
# (apps/app/src-tauri/src/instance.rs). Bereits im Abhängigkeitsbaum; Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
# OS-Sprache der Shell (`Lang::set_system`). MIT OR Apache-2.0.
sys-locale = "=0.3.2"
# TypeScript-Typen der Bridge aus Rust (Feature `ts` in backend-api, i18n, workflow, core-api; nur
# Build-/Testzeit, nicht in der ausgelieferten App). ts-rs 12.0.1 (31.01.2026), MIT.
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }

# --- nur Tests ------------------------------------------------------------------------------------
tempfile = "3.27.0"
proptest = "1.12.0"
# TLS-Testserver (net); Provider ring statt aws-lc-rs, bereits über hyper-rustls im Graph.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

# Lints (Welle 2, Paket I4): Die Ausnahmen für Stubs (`unused_variables`/`dead_code` = allow,
# `clippy::todo`/`unimplemented` = allow) sind aufgehoben. Solange einzelne Integrations-Crates noch
# `todo!()` enthalten, warnen nur diese (Warnung, kein Fehler); die CI prüft alle übrigen Crates mit
# `clippy --no-deps -- -D warnings` (Ausnahmeliste `CLIPPY_LENIENT` in .github/workflows/ci.yml,
# docs/entwicklung.md §5). Zusätzlich aktiviert sind nur Lints, die im Bestand ohne Befund sind.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_variables = "warn"
dead_code = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
# Bewusst nicht: `trivial_numeric_casts` – FFI-Typen wie `c_ulong` sind je Plattform verschieden
# (Windows u32, sonst u64), der Lint schlüge nur auf einzelnen Zielen an.

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
mem_forget = "warn"
rc_buffer = "warn"
lossy_float_literal = "warn"
verbose_file_reads = "warn"
unnecessary_safety_comment = "warn"
infinite_loop = "warn"
rest_pat_in_fully_bound_structs = "warn"
too_many_arguments = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
