# Release-Bundles für Windows, Linux und macOS – manuell auslösbar.
#
# Baut die optimierten Installer mit PDFium und Drittlizenz-Hinweisen (Plan §9.1) und legt sie als
# Artefakte ab. Code-Signierung mit Identität, Notarisierung und Updater fehlen noch (Signier-Identitäten
# beim Auftraggeber, Plan E-13); die Bundles sind zum Testen gedacht. macOS: PIDA.app ist ad hoc signiert
# (versiegelte Ressourcen, `codesign --verify --deep --strict` wird geprüft), aber nicht notarisiert.
name: Release-Bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.0"
  NODE_VERSION: "22"
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  bundle:
    name: Release-Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
            notices: true
          - os: windows-latest
            bundles: nsis,msi
            notices: false
          - os: macos-latest
            bundles: app,dmg
            notices: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plattenplatz freigeben (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PDFium-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pdfium.lock') }}
      - name: PDFium laden (macOS/Linux)
        if: runner.os != 'Windows'
        run: tools/fetch-pdfium.sh --github-env
      - name: PDFium laden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/fetch-pdfium.ps1 -GitHubEnv
      - name: Tauri-Systembibliotheken und Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            patchelf rpm xvfb
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: npm ci
        working-directory: apps/app
        run: npm ci
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.notices
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Drittlizenz-Hinweise (ins Bundle)
        if: matrix.notices
        run: tools/third-party-notices.sh --out target/notices
      - name: Release-Bundle (${{ matrix.bundles }}) mit PDFium
        working-directory: apps/app
        env:
          REQUIRE: ${{ matrix.notices && '--require-notices' || '' }}
          # macOS: DMG ohne Finder-Automation (AppleScript-Layout überspringen)
          CI: "true"
        run: |
          # shellcheck disable=SC2086 # REQUIRE ist leer oder genau ein Schalter
          node scripts/bundle-config.mjs --require-pdfium $REQUIRE --out src-tauri/bundle.conf.json
          npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/bundle.conf.json
      # Tauri signiert PIDA.app samt Frameworks (libpdfium.dylib) vor dem DMG-Bau ad hoc
      # (bundle.macOS.signingIdentity "-"). Nur vom Linker signiert („Sealed Resources=none“) meldete macOS
      # die heruntergeladene App als „beschädigt“ (0.2.0); geprüft werden die App und die App in der DMG.
      - name: Codesignatur prüfen (macOS, codesign --verify --deep --strict)
        if: runner.os == 'macOS'
        run: tools/verify-macos-bundle.sh target/release/bundle
      - name: Größe
        run: |
          {
            echo "### Release-Bundle ${{ matrix.os }} (${{ matrix.bundles }})"
            echo '```'
            du -sh target/release/bundle/*/* 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Startprüfung (Kern + WebView, PIDA_SMOKE=1)
        continue-on-error: ${{ runner.os != 'macOS' }}
        timeout-minutes: 3
        env:
          PIDA_SMOKE: "1"
        run: |
          home="$(mktemp -d)"
          case "$RUNNER_OS" in
            Linux) HOME="$home" xvfb-run -a target/release/pida ;;
            macOS) HOME="$home" "target/release/bundle/macos/PIDA.app/Contents/MacOS/pida" ;;
            Windows) APPDATA="$home" LOCALAPPDATA="$home" target/release/pida.exe ;;
          esac | tee smoke.txt
          # pdfium=true: die Bibliothek aus dem Bundle ist geladen (ad hoc mit Hardened Runtime lehnte macOS sie ab)
          grep -q '^pida-smoke: ok .*pdfium=true' smoke.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pida-release-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
