# PIDA – CI (Plan §8.7, §2.5/§10.2; ADR 0001 §4, ADR 0060 §1; docs/entwicklung.md „CI“)
#
# Jobs:
#   fmt      rustfmt, shellcheck der Werkzeuge in tools/ (blockierend)
#   build    Matrix ubuntu/macOS/Windows: check, Clippy (-D warnings außer CLIPPY_LENIENT), FIDO2-Features,
#            Tests mit PDFium (tools/fetch-pdfium.*) und den Orakeln qpdf/openssl/pyHanko/Java, wo verfügbar;
#            auf Linux zusätzlich der Doc-Build (rustdoc -D warnings)
#   deny     cargo-deny: Lizenzen, Advisories, Duplikate, Quellen; Selbsttest des npm-Lizenzprüfers
#            (blockierend, Plan §2.5)
#   notices  THIRD-PARTY-NOTICES (cargo-about + PDFium + Fonts + Rust-std + npm) als Artefakt (Plan §10.2)
#   mobile   cargo check für iOS und Android (blockierend für die lokal verifizierten Crates)
#   app      Tauri-Frontend apps/app (npm ci, Lizenzprüfung, build, test) – nur wenn apps/app/package.json existiert
#   bundle   Matrix ubuntu/macOS/Windows: Tauri-Debug-Bundle mit PDFium (und Drittlizenz-Hinweisen auf
#            Linux/macOS), macOS: Codesignatur (ad hoc, tools/verify-macos-bundle.sh), Größe in der
#            Zusammenfassung, Startprüfung PIDA_SMOKE=1 (Kern + WebView), Bundle als Artefakt
#
# Actions sind auf Commit-SHAs gepinnt (Kommentar = Release-Tag); Toolchain und Werkzeuge exakt versioniert.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Weniger Debug-Infos in Dev-/Test-Builds: Der volle Workspace inkl. Tauri sprengte auf
  # ubuntu-latest sonst den Plattenplatz (ld: Bus error beim Linken, erster CI-Lauf).
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.99.0"
  # Clippy läuft mit --no-deps und -D warnings für alle Crates außer diesen (für sie nur Warnungen):
  # pades, pdf-cos, sigblock, placement (Test golden_pdfas442), backend-keystore: je eine bekannte
  # dead_code-Warnung (docs/entwicklung.md §5; Welle 3 Track T2). workflow, core-api, cli und die
  # Tauri-Shell sind seit Welle 3 streng geprüft. Ziel ist eine leere Liste.
  CLIPPY_LENIENT: "pida-pades pida-pdf-cos pida-sigblock pida-placement pida-backend-keystore"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_ABOUT_VERSION: "0.9.2"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "21"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check
      - name: shellcheck (tools/*.sh ohne env.sh, das auch zsh bedient)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck; }
          shellcheck tools/fetch-pdfium.sh tools/third-party-notices.sh tools/cross-clippy.sh tools/verify-macos-bundle.sh

  build:
    name: Build/Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fido2: fido2-hid
          - os: macos-latest
            fido2: fido2-hid
          - os: windows-latest
            fido2: fido2-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plattenplatz freigeben (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --- PDFium (ADR 0060 §1): SHA-256 aus tools/pdfium.lock, PIDA_PDFIUM_DIR über GITHUB_ENV ---
      - name: PDFium-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pdfium.lock') }}
      - name: PDFium laden (macOS/Linux)
        if: runner.os != 'Windows'
        run: tools/fetch-pdfium.sh --github-env
      - name: PDFium laden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/fetch-pdfium.ps1 -GitHubEnv

      # --- Test-Orakel (Tests überspringen sich ohne Werkzeug) ---------------------------------------
      - name: Python (pyHanko, Pillow)
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/python-oracles.txt
      - name: pyHanko installieren
        env:
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PY" -m pip install --disable-pip-version-check -r tools/python-oracles.txt
          echo "PIDA_PYTHON=$PY" >> "$GITHUB_ENV"
      - name: Java 21 (nur Test-Orakel)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: qpdf, xmllint (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf libxml2-utils
      - name: qpdf, OpenSSL 3 (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install qpdf openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Orakel-Versionen
        run: |
          for t in qpdf openssl pyhanko java xmllint; do
            # openssl kennt nur `version`; sed statt head liest die ganze Ausgabe (kein SIGPIPE unter pipefail)
            if [ "$t" = openssl ]; then args=(version); else args=(--version); fi
            printf '%-8s ' "$t"; { "$t" "${args[@]}" 2>&1 || echo fehlt; } | sed -n 1p
          done

      # --- Tauri-Shell (apps/app, Paket I3): Systembibliotheken und Frontend-Build für generate_context! ---
      - name: apps/app erkennen
        id: app
        run: |
          if [ -f apps/app/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^[[:space:]]*"apps/app/src-tauri"' Cargo.toml; then echo "tauri=true" >> "$GITHUB_OUTPUT"; fi
      - name: Tauri-Systembibliotheken (Linux)
        if: runner.os == 'Linux' && steps.app.outputs.tauri == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Node
        if: steps.app.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('apps/app/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: apps/app/package-lock.json
      - name: Frontend bauen
        if: steps.app.outputs.frontend == 'true'
        working-directory: apps/app
        run: |
          npm ci
          npm run build --if-present

      # --- Rust ----------------------------------------------------------------------------------------
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo check ohne PDFium (Traits genügen, ADR 0001 §8.1)
        run: cargo check -p pida-render -p pida-placement -p pida-pades --no-default-features --all-targets --locked
      - name: cargo clippy (-D warnings)
        run: |
          excludes=()
          for c in $CLIPPY_LENIENT; do excludes+=(--exclude "$c"); done
          # --no-deps: -D warnings nur für die geprüften Crates, nicht für mitübersetzte Workspace-Abhängigkeiten
          cargo clippy --workspace "${excludes[@]}" --no-deps --all-targets --locked -- -D warnings
      - name: cargo clippy (CLIPPY_LENIENT, nicht blockierend)
        if: env.CLIPPY_LENIENT != ''
        run: |
          packages=()
          for c in $CLIPPY_LENIENT; do packages+=(-p "$c"); done
          cargo clippy "${packages[@]}" --no-deps --all-targets --locked
      - name: FIDO2 (${{ matrix.fido2 }}) – clippy
        run: cargo clippy -p pida-backend-atrust --features ${{ matrix.fido2 }} --no-deps --all-targets --locked -- -D warnings
      - name: FIDO2 (${{ matrix.fido2 }}) – test
        run: cargo test -p pida-backend-atrust --features ${{ matrix.fido2 }} --locked
      - name: cargo test
        # --no-fail-fast: alle Testbinaries laufen, auch nach einem Fehler (Windows-CI zeigte sonst je Lauf
        # nur den ersten fehlschlagenden Test; die Crates danach blieben ungeprüft)
        run: cargo test --workspace --locked --no-fail-fast
      - name: Doc-Build (rustdoc -D warnings)
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo-deny (Lizenzen, Advisories, Duplikate, Quellen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: cargo deny check
        run: cargo deny --locked check
      - name: npm-Lizenzprüfer (Selbsttest, Node des Runners)
        run: node tools/npm-licenses.mjs --self-test

  notices:
    name: THIRD-PARTY-NOTICES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: PDFium-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pdfium.lock') }}
      - name: Node (für apps/app)
        if: hashFiles('apps/app/package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: npm ci (Lizenztexte)
        if: hashFiles('apps/app/package-lock.json') != ''
        working-directory: apps/app
        run: npm ci --ignore-scripts
      - name: Hinweise erzeugen
        run: tools/third-party-notices.sh --out target/notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: THIRD-PARTY-NOTICES
          # THIRD-PARTY-NOTICES.md und RUST-STD-COPYRIGHT.html (Rust-Standardbibliothek)
          path: target/notices/
          if-no-files-found: error

  mobile:
    name: Mobile-Ziele (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Wie die App (tauri.conf.json, minimumSystemVersion): ohne Angabe übersetzt swift-rs das
      # Swift-Paket des Plugins für eine alte iOS-Version (UTType & Co. erst ab iOS 14).
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lokal verifiziert (docs/entwicklung.md „Cross-Checks“): seit Welle 3 auch config/workflow/core-api
          # (keyring nur für Desktop-Targets; auf iOS/Android setzt die Mobile-Shell den SecretStore); seit der
          # Mobile-Welle (M0) auch die Tauri-Shell samt Plugin pida-mobile (kompiliert dessen Swift-Paket).
          - os: macos-latest
            target: aarch64-apple-ios
            crates: >-
              pida-java-properties pida-i18n pida-pdf-cos pida-pdf-incremental pida-cades
              pida-sigblock pida-placement pida-render pida-sl12 pida-backend-api pida-net
              pida-backend-keystore pida-backend-localbku pida-backend-atrust pida-pades
              pida-config pida-workflow pida-core-api pida-app tauri-plugin-pida-mobile
          # Mit NDK (Schritt unten, C-Compiler für ring) lokal verifiziert (M0, NDK 29): alle Crates bis zur
          # Tauri-Shell samt Plugin pida-mobile (Android-Teil: rustls-platform-verifier über JNI).
          - os: ubuntu-latest
            target: aarch64-linux-android
            crates: >-
              pida-java-properties pida-i18n pida-pdf-cos pida-pdf-incremental pida-cades
              pida-sigblock pida-placement pida-render pida-sl12 pida-backend-api pida-config
              pida-backend-keystore pida-pades pida-workflow pida-net pida-backend-localbku
              pida-backend-atrust pida-core-api pida-app tauri-plugin-pida-mobile
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Android-NDK (C-Compiler für ring)
        if: contains(matrix.target, 'android')
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -n "$ndk" ] || { echo "kein Android-NDK auf dem Runner" >&2; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: cargo check (verifizierte Crates, blockierend)
        env:
          TARGET: ${{ matrix.target }}
          CRATES: ${{ matrix.crates }}
        run: |
          packages=()
          for c in $CRATES; do packages+=(-p "$c"); done
          cargo check --locked --target "$TARGET" "${packages[@]}"
      - name: cargo check (ganzer Workspace, informativ)
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
        run: cargo check --locked --target "$TARGET" --workspace

  app:
    name: apps/app (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: apps/app erkennen
        id: app
        run: |
          if [ -f apps/app/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/app/package.json fehlt – Frontend-Job übersprungen"
          fi
      - name: Node
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('apps/app/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: apps/app/package-lock.json
      - name: Lockfile vorhanden (Plan §2.5 – Node-Abhängigkeiten per Lockfile gepinnt)
        if: steps.app.outputs.present == 'true'
        run: test -f apps/app/package-lock.json || { echo "::error::apps/app/package-lock.json fehlt"; exit 1; }
      - name: Lizenzprüfung (Lockfile, Allowlist wie deny.toml)
        if: steps.app.outputs.present == 'true'
        run: node tools/npm-licenses.mjs apps/app/package-lock.json
      - name: npm ci
        if: steps.app.outputs.present == 'true'
        working-directory: apps/app
        run: npm ci
      - name: npm run lint
        if: steps.app.outputs.present == 'true'
        working-directory: apps/app
        run: npm run lint --if-present
      - name: npm run build
        if: steps.app.outputs.present == 'true'
        working-directory: apps/app
        run: npm run build --if-present
      - name: npm test
        if: steps.app.outputs.present == 'true'
        working-directory: apps/app
        run: npm run test --if-present

  bundle:
    name: Tauri-Debug-Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
            notices: true
          - os: macos-latest
            bundles: app
            notices: true
          # Windows: Hinweise noch ohne CI-Nachweis (tools/third-party-notices.sh unter Git Bash) – Bundle ohne
          # Hinweise, Release-Bundles verlangen sie (`npm run bundle:release`).
          - os: windows-latest
            bundles: nsis
            notices: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PDFium-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pdfium.lock') }}
      - name: PDFium laden (macOS/Linux)
        if: runner.os != 'Windows'
        run: tools/fetch-pdfium.sh --github-env
      - name: PDFium laden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/fetch-pdfium.ps1 -GitHubEnv
      - name: Tauri-Systembibliotheken und Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            patchelf xvfb
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: npm ci
        working-directory: apps/app
        run: npm ci
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.notices
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Drittlizenz-Hinweise (ins Bundle)
        if: matrix.notices
        run: tools/third-party-notices.sh --out target/notices
      - name: Debug-Bundle (${{ matrix.bundles }}) mit PDFium
        working-directory: apps/app
        env:
          REQUIRE: ${{ matrix.notices && '--require-notices' || '' }}
        run: |
          # shellcheck disable=SC2086 # REQUIRE ist leer oder genau ein Schalter
          node scripts/bundle-config.mjs --require-pdfium $REQUIRE --out src-tauri/bundle.conf.json
          npm run tauri -- build --debug --bundles ${{ matrix.bundles }} --config src-tauri/bundle.conf.json
      - name: Codesignatur prüfen (macOS, ad hoc mit versiegelten Ressourcen)
        if: runner.os == 'macOS'
        run: tools/verify-macos-bundle.sh target/debug/bundle
      - name: Größe
        run: |
          {
            echo "### Debug-Bundle ${{ matrix.os }} (${{ matrix.bundles }})"
            echo '```'
            du -sh target/debug/bundle/*/* 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Startprüfung (Kern + WebView, PIDA_SMOKE=1)
        # macOS lokal nachgewiesen (docs/integration/app-abnahme.md); Linux/Windows zunächst informativ
        continue-on-error: ${{ runner.os != 'macOS' }}
        timeout-minutes: 3
        env:
          PIDA_SMOKE: "1"
        run: |
          home="$(mktemp -d)"
          case "$RUNNER_OS" in
            Linux) HOME="$home" xvfb-run -a target/debug/pida ;;
            macOS) HOME="$home" "target/debug/bundle/macos/PIDA.app/Contents/MacOS/pida" ;;
            Windows) APPDATA="$home" LOCALAPPDATA="$home" target/debug/pida.exe ;;
          esac | tee smoke.txt
          grep -q '^pida-smoke: ok' smoke.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pida-debug-${{ matrix.os }}
          path: target/debug/bundle/
          if-no-files-found: error
