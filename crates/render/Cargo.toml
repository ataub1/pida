[package]
name = "pida-render"
description = "Renderer-Fassade (Trait Renderer) mit PDFium-Implementierung: Seiten, Forced-Color-Raster, Bildobjekte (Paket F)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# PDFium-Implementierung (`PdfiumBackend`, `PdfiumRenderer`). Standard für `cargo test -p pida-render`.
# Abhängige Crates binden `pida-render` ohne Default-Features ein (Workspace-Dependency mit
# `default-features = false`) und brauchen nur die Traits; `pdfium` aktiviert nur, wer `PdfiumBackend`
# konstruiert (`pida-core-api`, Tauri-Shell). Rückfall-Renderer (z. B. hayro, Plan §2.4) kämen als
# weiteres Feature hinzu.
default = ["pdfium"]
pdfium = ["dep:pdfium-render", "dep:zeroize"]

[dependencies]
pdfium-render = { workspace = true, optional = true }
png = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Passwort für die zweite (Forced-Color-)Dokumentinstanz nur im Speicher, beim Drop überschrieben.
zeroize = { workspace = true, optional = true }

[dev-dependencies]
# Testdokumente mit FlateDecode-Bildern (Dekompressionsbomben, Speicherbudget).
flate2 = { workspace = true }

# PDFium-Integrationstests brauchen das Feature `pdfium` (ohne werden sie nicht gebaut).
[[test]]
name = "pdfium"
required-features = ["pdfium"]

[[test]]
name = "bind_missing"
required-features = ["pdfium"]

[lints]
workspace = true
