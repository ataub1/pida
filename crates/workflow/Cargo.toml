[package]
name = "pida-workflow"
description = "Expliziter Reducer (State/Event/Effect), Warteschlange, Ausgaberegeln, Exit-Codes (Integration)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# TypeScript-Typen der Bridge (ts-rs, nur für `pida-core-api/ts`).
ts = ["dep:ts-rs"]

[dependencies]
# Dateizugriff: nativ std::fs, im Browser im Speicher (Konzept Webdienst)
pida-fs = { workspace = true }
pida-backend-api = { workspace = true }
pida-placement = { workspace = true }
pida-pades = { workspace = true }
pida-config = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

ts-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
pida-pdf-cos = { workspace = true }

[lints]
workspace = true
