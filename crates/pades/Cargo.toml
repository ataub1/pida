[package]
name = "pida-pades"
description = "PAdES-Kern: Analyse (K1–K5), SignPlan, Zweiphasenmodell Prepared, Selbstprüfung I1–I6 (Integration)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Dateizugriff: nativ std::fs, im Browser im Speicher (Konzept Webdienst)
pida-fs = { workspace = true }
pida-pdf-cos = { workspace = true }
pida-pdf-incremental = { workspace = true }
pida-cades = { workspace = true }
pida-sigblock = { workspace = true }
pida-render = { workspace = true }
# Welle 2 (I1): Positionierung, QR-Platzhalter und leere Felder für den Signierplan
# (`plan_signature`, `find_placeholder`); kein Zyklus (placement hängt nur von pdf-cos/render ab).
pida-placement = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
# Persistenz des vorbereiteten Zustands (Mobile-Lebenszyklus, `Prepared::persist`)
serde_json = { workspace = true }
tracing = { workspace = true }
# sRGB-ICC-Profil des OutputIntents (FlateDecode)
flate2 = { workspace = true }
# lokale Zeit mit Offset für `/M` und signing-time (ADR 0001 §8.7)
jiff = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Ende-zu-Ende: PDFium als Renderer (Rasterscan, I5, Pixelprüfung), Keystore-Backend (Modell A)
pida-render = { workspace = true, features = ["pdfium"] }
pida-backend-api = { workspace = true, features = ["testing"] }
pida-backend-keystore = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
zeroize = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
