[package]
name = "pdfover-net"
description = "HTTP-Fassade: Cookie-Jar je Sitzung, manuelle Redirects, Proxy (System/manuell), OS-Truststore (Paket D)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Test-Hilfen (lokaler Mock-HTTP-Server) für die Pakete D: `pdfover-net = { workspace = true, features = ["testing"] }`
# als dev-dependency.
testing = ["tokio/io-util", "tokio/rt", "tokio/time"]

[dependencies]
reqwest = { workspace = true }
rustls = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["net"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
# Charset-Dekodierung von Antwortkörpern (`Response::text`). Lizenz (Apache-2.0 OR MIT) AND BSD-3-Clause.
encoding_rs = { workspace = true }
# Nur für `hyper::ext::ReasonPhrase` (nicht-kanonische Reason-Phrase für `atrusterror.http_generic`), MIT.
hyper = { workspace = true }

[dev-dependencies]
pdfover-net = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
# Nur Tests: TLS-Server mit selbstsigniertem Zertifikat (Ablehnung durch den OS-Truststore).
# MIT/Apache-2.0; Provider ring statt aws-lc-rs.
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
