[package]
name = "pida-config"
description = "Versioniertes Settings-Schema (TOML), Legacy-Import PDF-Over.config, CLI-Overlay, Richtlinien, Pfade, Secrets (Paket E)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
pida-java-properties = { workspace = true }
pida-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# OS-Schlüsselbund nur auf dem Desktop (macOS Keychain, Windows Credential Manager, Linux Secret
# Service). Unter iOS/Android verlangt apple-native-keyring-store das Feature `protected`; dort setzt die
# Mobile-Shell ihren eigenen `SecretStore` ein (`secure-store`-Plugin, Mobile-Welle).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
