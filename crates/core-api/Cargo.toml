[package]
name = "pdfover-core-api"
description = "Stabile Fassade für Tauri-Shell, CLI und Plan-B-Shell: dispatch(UiEvent), subscribe(ViewState) (Integration)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Test-Hilfen (Fake-PAdES-Engine, `testing`-Modul) für die eigenen Tests und die CLI-Tests.
testing = []

[dependencies]
pdfover-workflow = { workspace = true }
pdfover-config = { workspace = true }
pdfover-i18n = { workspace = true }
pdfover-render = { workspace = true, features = ["pdfium"] }
pdfover-pades = { workspace = true }
pdfover-placement = { workspace = true }
pdfover-sigblock = { workspace = true }
pdfover-cades = { workspace = true }
pdfover-pdf-cos = { workspace = true }
pdfover-backend-api = { workspace = true }
pdfover-backend-atrust = { workspace = true }
pdfover-backend-localbku = { workspace = true }
pdfover-backend-keystore = { workspace = true }
pdfover-net = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
jiff = { workspace = true }
# Logdatei (nicht blockierend) mit Rotation beim Start (Plan §7.1). MIT. Noch nicht in
# [workspace.dependencies] – die Integration hebt die Abhängigkeit dorthin (ADR 0001 §4 Regel 2).
tracing-appender = "=0.2.5"

[dev-dependencies]
# eigene Test-Hilfen auch für die Integrationstests unter tests/
pdfover-core-api = { workspace = true, features = ["testing"] }
pdfover-backend-api = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
toml = { workspace = true }

[lints]
workspace = true
