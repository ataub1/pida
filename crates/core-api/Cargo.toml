[package]
name = "pida-core-api"
description = "Stabile Fassade für Tauri-Shell, CLI und Plan-B-Shell: dispatch(UiEvent), subscribe(ViewState) (Integration)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Test-Hilfen (Fake-PAdES-Engine, `testing`-Modul) für die eigenen Tests und die CLI-Tests.
testing = []
# TypeScript-Typen der Bridge (`ts::typescript_bindings`, Vertragstest `tests/ts_bindings.rs`).
ts = ["dep:ts-rs", "pida-workflow/ts", "pida-backend-api/ts", "pida-i18n/ts"]

[dependencies]
pida-workflow = { workspace = true }
pida-config = { workspace = true }
pida-i18n = { workspace = true }
pida-render = { workspace = true, features = ["pdfium"] }
pida-pades = { workspace = true }
pida-placement = { workspace = true }
pida-sigblock = { workspace = true }
pida-cades = { workspace = true }
pida-pdf-cos = { workspace = true }
pida-backend-api = { workspace = true }
pida-backend-atrust = { workspace = true }
pida-backend-localbku = { workspace = true }
pida-backend-keystore = { workspace = true }
pida-net = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
jiff = { workspace = true }
# Prüfsummen des persistierten Signierzustands („Signatur fortsetzen“, src/resume.rs). MIT OR Apache-2.0.
hex = { workspace = true }
# Logdatei (nicht blockierend) mit Rotation beim Start (Plan §7.1). MIT.
tracing-appender = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# eigene Test-Hilfen auch für die Integrationstests unter tests/
pida-core-api = { workspace = true, features = ["testing", "ts"] }
pida-backend-api = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
toml = { workspace = true }

[lints]
workspace = true
