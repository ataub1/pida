[package]
name = "pida-sigblock"
description = "Signaturblock: PDF-AS-Profile (IR), Ausdrücke, f32-Layout, Fonts, Emblem, Appearance-XObjects (Paket C)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
pida-pdf-cos = { workspace = true }
pida-java-properties = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
skrifa = { workspace = true }
subsetter = { workspace = true }
png = { workspace = true }
zune-jpeg = { workspace = true }
gif = { workspace = true }
kamadak-exif = { workspace = true }
flate2 = { workspace = true }
# Java-TimeZone-IDs für `timezone` (ADR 0001 §8.7)
jiff = { workspace = true }
# SHA-256 der Bildmarke (Cache-Schlüssel `Emblem::source_sha256`)
sha2 = { workspace = true }

[features]
# Demo-Bildmarke der Amtssignatur aus PDF-AS und `ProfileStore::builtin_pdfas` – nur für den Abgleich mit PDF-AS
# (Golden-Tests); die Pakete liefern sie nicht aus (Backlog Nr. 10)
pdfas-reference = []

[dev-dependencies]
# eigene Integrationstests (tests/) mit der PDF-AS-Referenz
pida-sigblock = { path = ".", features = ["pdfas-reference"] }
time = { workspace = true }
tempfile = { workspace = true }
# Pixelvergleich (tests/render.rs, nur mit PIDA_PDFIUM_DIR)
pdfium-render = { workspace = true }
proptest = { workspace = true }
# Manifeste des PDF-AS-4.4.2-Golden-Laufs (tests/golden_pdfas442.rs, Paket I5)
serde_json = { workspace = true }

[lints]
workspace = true
