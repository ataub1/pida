[package]
name = "pida-backend-atrust"
description = "ID Austria über A-Trust, Szenario A: nativer SL-1.2-HTTPS-Ablauf, Seitenklassifikation, Long-Poll, FIDO2 (Paket D)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Native FIDO2-Authenticatoren (nur Desktop), beide ohne zusätzliche Abhängigkeiten:
# - fido2-windows: webauthn.dll (dynamisch geladen, FFI in src/fido2/windows.rs)
# - fido2-hid: CTAP2 über USB-HID (Linux hidraw ohne unsafe, macOS IOKit-FFI in src/fido2/hid/macos.rs)
# `fido2::platform_provider()` liefert den passenden Provider der eingeschalteten Features.
fido2-windows = []
fido2-hid = []

[dependencies]
pida-backend-api = { workspace = true }
pida-cades = { workspace = true }
pida-sl12 = { workspace = true }
pida-net = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
# SHA-256 von clientDataJSON (CTAP2-HID, `clientDataHash`).
sha2 = { workspace = true }
# CTAP2 `clientPIN` (PIN/UV-Auth-Protokoll 1 und 2, `src/fido2/pin.rs`; Welle 3): ECDH P-256,
# AES-256-CBC, HMAC-SHA-256 (HKDF-SHA-256 darauf), Zufall für Schlüssel und IV. Nur RustCrypto;
# aes/cbc in den Versionen, die lopdf 0.45 schon zieht; hmac 0.12 passt zu sha2 0.10 (keine neuen Crates im
# Lockfile). Schlüssel für ECDH aus dem Systemzufall (`Generate`, Feature `getrandom` von p256 0.14).
# Lizenz jeweils MIT OR Apache-2.0.
p256 = { workspace = true, features = ["ecdh", "getrandom"] }
rand_core = { workspace = true }
aes = "=0.9.3"
cbc = "=0.2.1"
hmac = "=0.12.1"

[dev-dependencies]
pida-backend-api = { workspace = true, features = ["testing"] }
pida-net = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json = { workspace = true }

[lints]
workspace = true
