[package]
name = "pdfover-backend-atrust"
description = "ID Austria über A-Trust, Szenario A: nativer SL-1.2-HTTPS-Ablauf, Seitenklassifikation, Long-Poll, FIDO2 (Paket D)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Native FIDO2-Authenticatoren (nur Desktop), beide ohne zusätzliche Abhängigkeiten:
# - fido2-windows: webauthn.dll (dynamisch geladen, FFI in src/fido2/windows.rs)
# - fido2-hid: CTAP2 über USB-HID (Linux hidraw ohne unsafe, macOS IOKit-FFI in src/fido2/hid/macos.rs)
# `fido2::platform_provider()` liefert den passenden Provider der eingeschalteten Features.
fido2-windows = []
fido2-hid = []

[dependencies]
pdfover-backend-api = { workspace = true }
pdfover-cades = { workspace = true }
pdfover-sl12 = { workspace = true }
pdfover-net = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
# SHA-256 von clientDataJSON (CTAP2-HID, `clientDataHash`).
sha2 = { workspace = true }

[dev-dependencies]
pdfover-backend-api = { workspace = true, features = ["testing"] }
pdfover-net = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json = { workspace = true }

[lints]
workspace = true
