[package]
name = "pida-i18n"
description = "Fluent-Kataloge (de, en) für Kern, CLI und UI; Konverter für messages*.properties (Paket E)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# TypeScript-Typen der Bridge (ts-rs, nur für `pida-core-api/ts`).
ts = ["dep:ts-rs"]

[dependencies]
pida-java-properties = { workspace = true }
fluent-bundle = { workspace = true }
fluent-syntax = { workspace = true }
unic-langid = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# tests/code_catalog.rs liest testdata/i18n/wave1-message-ids.json
serde_json = { workspace = true }

[lints]
workspace = true
