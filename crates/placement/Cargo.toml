[package]
name = "pida-placement"
description = "Koordinatenräume, Positionsstring, PDF-AS-Positionierung, Auto-Position (Rasterscan), QR-Platzhalter, leere Felder (Paket F)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
pida-pdf-cos = { workspace = true }
pida-render = { workspace = true }
# Erkennen und – für „QR-Platzhalter erstellen“ – Erzeugen von QR-Codes
rxing = { workspace = true, features = ["encoders"] }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Tests mit echtem PDFium (nur mit PIDA_PDFIUM_DIR, sonst übersprungen).
pida-render = { workspace = true, features = ["pdfium"] }
# Referenzbilder der PDF-AS-Testsuiten lesen, Manifest der Golden-Tests.
png = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
