[package]
name = "pida-pdf-incremental"
description = "Append-only-Writer: Increment mit Signaturdictionary, /Contents- und /ByteRange-Platzhalter (Paket A)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
pida-pdf-cos = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
# xref-Streams und optional neue Streams (Flate)
flate2 = { workspace = true }
# neues /ID[1] wie PDFBox 2.0.34 (SHA-256)
sha2 = { workspace = true }

# Browser: die Standardbibliothek hat dort keine Uhr (`SystemTime::now` bricht ab) – Zeit aus JavaScript
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
