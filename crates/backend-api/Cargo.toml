[package]
name = "pida-backend-api"
description = "Backend-Schnittstelle: Capabilities, SignatureBackend/BackendSession, SignJob/SignResult, InteractionBroker (Integration)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# TypeScript-Typen der Bridge (ts-rs, nur für `pida-core-api/ts`).
ts = ["dep:ts-rs"]
# Test-Hilfen (ScriptedBroker, MemoryDocument) für die Backend-Pakete B und D:
# `pida-backend-api = { workspace = true, features = ["testing"] }` als dev-dependency.
testing = []

[dependencies]
pida-cades = { workspace = true }
pida-i18n = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
time = { workspace = true }

ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
