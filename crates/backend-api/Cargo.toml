[package]
name = "pdfover-backend-api"
description = "Backend-Schnittstelle: Capabilities, SignatureBackend/BackendSession, SignJob/SignResult, InteractionBroker (Integration)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Test-Hilfen (ScriptedBroker, MemoryDocument) für die Backend-Pakete B und D:
# `pdfover-backend-api = { workspace = true, features = ["testing"] }` als dev-dependency.
testing = []

[dependencies]
pdfover-cades = { workspace = true }
pdfover-i18n = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
